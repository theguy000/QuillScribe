[package]
name = "quillscribe"
version = "0.2.0"
description = "Beautiful Voice-to-Text Transcription App"
authors = ["QuillScribe Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

# Audio capture
cpal = "0.15"

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

# Clipboard operations
arboard = "3"

# Audio encoding
hound = "3.5"

# Local Whisper transcription (whisper.cpp via Rust bindings)
whisper-rs = "0.16"

# Audio playback (notification sounds)
rodio = "0.19"

# Auto-updater
tauri-plugin-updater = "2"

# Config directories
dirs = "6"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Async
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# UUID for unique IDs
uuid = { version = "1", features = ["v4"] }

# Windows-specific
# Optimize all dependencies in dev builds for faster startup.
# Code stays at opt-level 0 for fast recompilation.
[profile.dev.package."*"]
opt-level = 2

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
