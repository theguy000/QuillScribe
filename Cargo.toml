[package]
name = "quillscribe"
version = "0.1.3"
description = "Beautiful Voice-to-Text Transcription App"
authors = ["QuillScribe Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
slint-build = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Slint UI framework
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
i-slint-backend-winit = { version = "1", optional = true }

# System tray (Tauri doesn't provide one in Slint mode)
tray-icon = "0.17"

# Global hotkey (replaces tauri-plugin-global-shortcut)
global-hotkey = "0.6"

# Auto-start (replaces tauri-plugin-autostart)
auto-launch = "0.5"

# Self-updater (replaces tauri-plugin-updater)
self_update = { version = "0.41", features = ["archive-tar", "compression-flate2"] }

# System notifications (replaces tauri-plugin-notification)
notify-rust = "4"

# Logging
env_logger = "0.11"

# Audio capture
cpal = "0.15"

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

# Clipboard operations
arboard = "3"

# Audio encoding
hound = "3.5"

# Local Whisper transcription (whisper.cpp via Rust bindings)
whisper-rs = "0.16"

# Audio playback (notification sounds)
rodio = "0.19"

# Config directories
dirs = "6"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Async
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# UUID for unique IDs
uuid = { version = "1", features = ["v4"] }

# Random
rand = "0.8"

# PNG decoding for tray icons
png = "0.17"

# Optimize all dependencies in dev builds for faster startup.
# Code stays at opt-level 0 for fast recompilation.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Com",
] }
