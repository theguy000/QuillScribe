name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux-release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # -- Set version from git tag ----------------------------------------
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Setting version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # -- Rust -------------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # -- Linux system dependencies ---------------------------------------
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            desktop-file-utils \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfuse2 \
            libgl1-mesa-dev \
            libssl-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxtst-dev \
            mold \
            patchelf \
            pkg-config \
            librsvg2-dev \
            wget

      # -- Build ------------------------------------------------------------
      - name: Build release binary
        run: cargo build --release

      # -- Package ----------------------------------------------------------
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-pkg
          cp target/release/quillscribe release-pkg/quillscribe
          chmod +x release-pkg/quillscribe
          tar -czf quillscribe-x86_64-unknown-linux-gnu.tar.gz -C release-pkg quillscribe

          mkdir -p \
            appdir/usr/bin \
            appdir/usr/share/applications \
            appdir/usr/share/icons/hicolor/32x32/apps \
            appdir/usr/share/icons/hicolor/128x128/apps \
            appdir/usr/share/icons/hicolor/256x256/apps
          cp target/release/quillscribe appdir/usr/bin/quillscribe
          cp icons/32x32.png appdir/usr/share/icons/hicolor/32x32/apps/quillscribe.png
          cp icons/128x128.png appdir/usr/share/icons/hicolor/128x128/apps/quillscribe.png
          cp icons/128x128@2x.png appdir/usr/share/icons/hicolor/256x256/apps/quillscribe.png
          cat > appdir/usr/share/applications/quillscribe.desktop <<'EOF'
          [Desktop Entry]
          Name=QuillScribe
          Comment=Voice-to-Text Transcription App
          Exec=quillscribe
          Icon=quillscribe
          Type=Application
          Categories=AudioVideo;Audio;Utility;
          StartupWMClass=QuillScribe
          Terminal=false
          EOF
          cp appdir/usr/share/applications/quillscribe.desktop appdir/quillscribe.desktop
          cp appdir/usr/share/icons/hicolor/256x256/apps/quillscribe.png appdir/quillscribe.png
          cat > appdir/AppRun <<'EOF'
          #!/usr/bin/env sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/quillscribe" "$@"
          EOF
          chmod 755 appdir/AppRun

          mkdir -p \
            deb/DEBIAN \
            deb/usr/bin \
            deb/usr/share/applications \
            deb/usr/share/icons/hicolor/32x32/apps \
            deb/usr/share/icons/hicolor/128x128/apps \
            deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/quillscribe deb/usr/bin/quillscribe
          cp appdir/usr/share/applications/quillscribe.desktop deb/usr/share/applications/quillscribe.desktop
          cp icons/32x32.png deb/usr/share/icons/hicolor/32x32/apps/quillscribe.png
          cp icons/128x128.png deb/usr/share/icons/hicolor/128x128/apps/quillscribe.png
          cp icons/128x128@2x.png deb/usr/share/icons/hicolor/256x256/apps/quillscribe.png
          chmod 755 deb/usr/bin/quillscribe
          cat > deb/DEBIAN/control <<EOF
          Package: quillscribe
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: QuillScribe Team
          Description: Beautiful Voice-to-Text Transcription App
          Depends: libc6, libasound2 | libasound2t64, libdbus-1-3, libfontconfig1, libgcc-s1, libgl1, libssl3 | libssl1.1, libx11-6, libxcb1, libxcb-shape0, libxcb-xfixes0, libxi6, libxkbcommon0, libxtst6, hicolor-icon-theme
          EOF
          dpkg-deb --build deb "quillscribe_${VERSION}_amd64.deb"

          appimage_target="quillscribe-${VERSION}-x86_64.AppImage"
          appimagekit_version="13"
          appimagetool_url="https://github.com/AppImage/AppImageKit/releases/download/${appimagekit_version}/obsolete-appimagetool-x86_64.AppImage"
          runtime_url="https://github.com/AppImage/AppImageKit/releases/download/${appimagekit_version}/obsolete-runtime-x86_64"
          wget -q "$appimagetool_url" -O appimagetool-x86_64.AppImage
          wget -q "$runtime_url" -O runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage runtime-x86_64
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            --comp xz \
            --runtime-file runtime-x86_64 \
            appdir \
            "$appimage_target"

          smoke_appimage() {
            local label="$1"
            shift
            local output status
            set +e
            output=$("$@" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if grep -q 'elf_machine_rela_relative' <<< "$output"; then
              echo "AppImage smoke test failed with loader relocation assertion in ${label}" >&2
              return 1
            fi
            if [[ "$status" -ne 0 ]]; then
              echo "AppImage smoke test failed in ${label} with status ${status}" >&2
              return "$status"
            fi
          }

          smoke_appimage "Ubuntu runner" env APPIMAGE_EXTRACT_AND_RUN=1 "./${appimage_target}" --appimage-version
          smoke_appimage "Arch Linux container" docker run --rm \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc "./${appimage_target} --appimage-version"

          cat > release-body.md <<EOF
          ## QuillScribe ${GITHUB_REF_NAME}

          ### Downloads
          | Platform | File |
          |----------|------|
          | Linux x86_64 updater archive | \`quillscribe-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux x86_64 AppImage | \`quillscribe-${VERSION}-x86_64.AppImage\` |
          | Debian/Ubuntu amd64 package | \`quillscribe_${VERSION}_amd64.deb\` |
          | Windows x86_64 updater archive | \`quillscribe-x86_64-pc-windows-msvc.tar.gz\` |
          | Windows x86_64 executable | \`quillscribe-x86_64-pc-windows-msvc.exe\` |
          EOF

      # -- Upload -----------------------------------------------------------
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuillScribe ${{ github.ref_name }}"
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            quillscribe*.tar.gz
            quillscribe*.AppImage
            quillscribe*.deb

  build-windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # -- Set version from git tag ----------------------------------------
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Setting version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # -- Rust -------------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # -- Windows: ensure cmake is available (for whisper.cpp build) -------
      - name: Verify cmake (Windows)
        run: cmake --version

      - name: Configure LLVM for bindgen (Windows)
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            throw "libclang.dll was not found at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

      # -- Build ------------------------------------------------------------
      - name: Build release binary
        run: cargo build --release

      - name: Package binary (Windows)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pkg
          cp target/release/quillscribe.exe release-pkg/quillscribe.exe
          cp target/release/quillscribe.exe quillscribe-x86_64-pc-windows-msvc.exe
          tar -czf quillscribe-x86_64-pc-windows-msvc.tar.gz -C release-pkg quillscribe.exe

          cat > release-body.md <<EOF
          ## QuillScribe ${GITHUB_REF_NAME}

          ### Downloads
          | Platform | File |
          |----------|------|
          | Linux x86_64 updater archive | \`quillscribe-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux x86_64 AppImage | \`quillscribe-${VERSION}-x86_64.AppImage\` |
          | Debian/Ubuntu amd64 package | \`quillscribe_${VERSION}_amd64.deb\` |
          | Windows x86_64 updater archive | \`quillscribe-x86_64-pc-windows-msvc.tar.gz\` |
          | Windows x86_64 executable | \`quillscribe-x86_64-pc-windows-msvc.exe\` |
          EOF

      # -- Upload -----------------------------------------------------------
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuillScribe ${{ github.ref_name }}"
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            quillscribe*.tar.gz
            quillscribe*.exe
