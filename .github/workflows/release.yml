name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Set version from git tag ───────────────────────────────────────
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Commit version bump back to repo
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          git checkout "$BRANCH"
          git add Cargo.toml
          git diff --cached --quiet && echo "No version changes to commit" && exit 0
          git commit -m "chore: bump version to ${{ github.ref_name }}"
          git push origin "$BRANCH"

      # ── Rust ────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ──────────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            cmake \
            clang

      # ── Windows: ensure cmake is available (for whisper.cpp build) ─────
      - name: Verify cmake (Windows)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release

      # ── Upload ─────────────────────────────────────────────────────────
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuillScribe ${{ github.ref_name }}"
          body: |
            ## QuillScribe ${{ github.ref_name }}

            See the assets below to download and install.
          draft: true
          prerelease: false
          files: |
            target/release/quillscribe${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
