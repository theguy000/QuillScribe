name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Set version from git tag ───────────────────────────────────────
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # ── Rust ────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ──────────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxi-dev \
            libxtst-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            cmake \
            clang \
            mold

      # ── Windows: ensure cmake is available (for whisper.cpp build) ─────
      - name: Verify cmake (Windows)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release

      # ── Package ────────────────────────────────────────────────────────
      - name: Package binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p release-pkg
          cp target/release/quillscribe release-pkg/quillscribe
          chmod +x release-pkg/quillscribe
          tar -czf quillscribe-x86_64-unknown-linux-gnu.tar.gz -C release-pkg quillscribe

      - name: Package binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-pkg
          cp target/release/quillscribe.exe release-pkg/quillscribe.exe
          tar -czf quillscribe-x86_64-pc-windows-msvc.tar.gz -C release-pkg quillscribe.exe

      # ── Upload ─────────────────────────────────────────────────────────
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuillScribe ${{ github.ref_name }}"
          body: |
            ## QuillScribe ${{ github.ref_name }}

            See the assets below to download and install.
          draft: false
          prerelease: false
          files: |
            quillscribe*.tar.gz
