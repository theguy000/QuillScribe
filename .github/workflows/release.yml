name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-20.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Set version from git tag ───────────────────────────────────────
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Setting version to $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # ── Rust ────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ──────────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libfuse2 \
            pkg-config \
            libfontconfig1-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxi-dev \
            libxtst-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            cmake \
            clang \
            mold \
            wget

      # ── Windows: ensure cmake is available (for whisper.cpp build) ─────
      - name: Verify cmake (Windows)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release

      # ── Package ────────────────────────────────────────────────────────
      - name: Package Linux artifacts
        if: matrix.platform == 'ubuntu-20.04'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-pkg
          cp target/release/quillscribe release-pkg/quillscribe
          chmod +x release-pkg/quillscribe
          tar -czf quillscribe-x86_64-unknown-linux-gnu.tar.gz -C release-pkg quillscribe

          mkdir -p appdir/usr/bin appdir/usr/share/applications appdir/usr/share/icons/hicolor/128x128/apps
          cp target/release/quillscribe appdir/usr/bin/quillscribe
          cp icons/128x128.png appdir/usr/share/icons/hicolor/128x128/apps/quillscribe.png
          cat > appdir/usr/share/applications/quillscribe.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=QuillScribe
          Comment=Beautiful Voice-to-Text Transcription App
          Exec=quillscribe
          Icon=quillscribe
          Categories=Utility;Audio;
          Terminal=false
          EOF

          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/128x128/apps
          cp target/release/quillscribe deb/usr/bin/quillscribe
          cp appdir/usr/share/applications/quillscribe.desktop deb/usr/share/applications/quillscribe.desktop
          cp icons/128x128.png deb/usr/share/icons/hicolor/128x128/apps/quillscribe.png
          chmod 755 deb/usr/bin/quillscribe
          cat > deb/DEBIAN/control <<EOF
          Package: quillscribe
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: QuillScribe Team
          Description: Beautiful Voice-to-Text Transcription App
          Depends: libasound2, libdbus-1-3, libfontconfig1, libgcc-s1, libgl1, libx11-6, libxcb1, libxi6, libxtst6
          EOF
          dpkg-deb --build deb "quillscribe_${VERSION}_amd64.deb"

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir appdir \
            --executable appdir/usr/bin/quillscribe \
            --desktop-file appdir/usr/share/applications/quillscribe.desktop \
            --icon-file appdir/usr/share/icons/hicolor/128x128/apps/quillscribe.png \
            --output appimage
          mv "QuillScribe-${VERSION}-x86_64.AppImage" "quillscribe-${VERSION}-x86_64.AppImage"

      - name: Package binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-pkg
          cp target/release/quillscribe.exe release-pkg/quillscribe.exe
          cp target/release/quillscribe.exe quillscribe-x86_64-pc-windows-msvc.exe
          tar -czf quillscribe-x86_64-pc-windows-msvc.tar.gz -C release-pkg quillscribe.exe

      # ── Upload ─────────────────────────────────────────────────────────
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuillScribe ${{ github.ref_name }}"
          body: |
            ## QuillScribe ${{ github.ref_name }}

            See the assets below to download and install.
          draft: false
          prerelease: false
          files: |
            quillscribe*.tar.gz
            quillscribe*.AppImage
            quillscribe*.deb
            quillscribe*.exe
