name: Publish to AUR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v), e.g. 0.1.3"
        required: true

permissions:
  contents: write

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Compute sha256 of source tarball
        id: sha
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.ver.outputs.tag }}.tar.gz"
          echo "Downloading $url"
          sha=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"

      - name: Update PKGBUILD
        run: |
          sed -i -E "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i -E "s/^sha256sums=.*/sha256sums=('${{ steps.sha.outputs.sha }}')/" PKGBUILD
          echo "--- updated PKGBUILD ---"
          head -30 PKGBUILD

      - name: Generate .SRCINFO (in Arch container)
        run: |
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:base-devel bash -c '
            useradd -m builder &&
            chown -R builder:builder /pkg &&
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
          '
          echo "--- .SRCINFO ---"
          cat .SRCINFO

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # --- SSH setup --------------------------------------------------
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            User aur
          EOF
          chmod 600 ~/.ssh/config

          # --- Git identity ----------------------------------------------
          git config --global user.name  "Istiak"
          git config --global user.email "istiakm30@gmail.com"

          # --- Clone, update, push ---------------------------------------
          workdir="$(mktemp -d)"
          git clone ssh://aur@aur.archlinux.org/quillscribe.git "$workdir/aur"
          cp PKGBUILD .SRCINFO "$workdir/aur/"
          cd "$workdir/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push."
          else
            git commit -m "upgpkg: quillscribe ${VERSION}-1"
            git push origin master
          fi
